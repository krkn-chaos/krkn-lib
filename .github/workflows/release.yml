name: Create Release
on:
  push:
    tags:
      - 'v*'
jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: calculate previous tag
        run: |
          git fetch --tags origin
          PREVIOUS_TAG=$(git tag --sort=-creatordate | sed -n '2 p')
          echo $PREVIOUS_TAG 
          echo "PREVIOUS_TAG=$PREVIOUS_TAG" >> "$GITHUB_ENV"

      - name: generate release notes from template
        id: release-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api \
          --method POST \
          -H "Accept: application/vnd.github+json" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          /repos/krkn-chaos/krkn-lib/releases/generate-notes \
          -f "tag_name=$GITHUB_REF_NAME" -f "target_commitish=main" -f "previous_tag_name=$PREVIOUS_TAG" \
          | jq -r .body > "$RUNNER_TEMP/generated-release-notes.md"

      - name: replace placeholders in template
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          template = Path('.github/release-template.md').read_text()
          notes = (Path(os.environ['RUNNER_TEMP']) / 'generated-release-notes.md').read_text()
          result = template.replace('{VERSION}', os.environ['GITHUB_REF_NAME']).replace('{CHANGES}', notes.rstrip('\n'))
          Path('release-notes.md').write_text(result)
          PY
      - name: create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" -F release-notes.md

      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sudo sh -s -- -b /usr/local/bin

      - name: Generate SBOM
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          syft . --scope all-layers --output cyclonedx-json > sbom.json
          echo "SBOM generated successfully!"
          gh release upload "$GITHUB_REF_NAME" sbom.json
